services:
  # =======================================================
  # 1. Backend Web Service (Node.js, Express & Mongoose)
  # =======================================================
  - type: web
    name: warehouse-marketplace-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: 10
      - key: PLATFORM_COMMISSION_PERCENT
        value: 10
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # =======================================================
  # 2. Frontend Static Site (Angular 18 SPA)
  # =======================================================
  - type: web
    name: warehouse-marketplace-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && node scripts/set-env.js && npm run build
    staticPublishPath: dist/warehouse-marketplace-frontend/browser
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        sync: false
